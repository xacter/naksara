name: Cloudflare'a yayınla
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency: deploy
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 34ae3af0af445f0ac98d8c40b5917e02
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] && [ -f .deploy-token ]; then
            t=$(tr -d '\r\n ' < .deploy-token)
            echo "::add-mask::$t"
            echo "CLOUDFLARE_API_TOKEN=$t" >> "$GITHUB_ENV"
          fi
      - name: Dosyaları üret
        run: python3 build/build.py source/naksara.html
      - name: workers.dev alt alan adını hazırla
        run: |
          api="https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain"
          auth="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          cur=$(curl -s -H "$auth" "$api" | jq -r '.result.subdomain // empty')
          if [ -z "$cur" ]; then
            for name in aykutbulunmaz naksara-app "naksara-$(openssl rand -hex 3)"; do
              res=$(curl -s -X PUT -H "$auth" -H 'Content-Type: application/json' -d "{\"subdomain\":\"$name\"}" "$api")
              echo "$res" | jq -c '{success, errors}'
              if [ "$(echo "$res" | jq -r .success)" = "true" ]; then cur=$name; break; fi
            done
          fi
          echo "workers.dev alt alan adı: $cur"
      - name: Yayınla
        run: npx -y wrangler@4 deploy
      - name: Canlı kontrol
        run: |
          sub=$(curl -s -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r '.result.subdomain')
          url="https://naksara.$sub.workers.dev"
          sleep 5
          login=$(curl -s -o /tmp/l.html -w '%{http_code} %{time_total}s' "$url/")
          api=$(curl -s -o /dev/null -w '%{http_code}' "$url/api/revs")
          title=$(grep -o '<title>[^<]*' /tmp/l.html | sed 's/<title>//')
          enc=$(curl -s -o /dev/null -D - -H 'Accept-Encoding: br, gzip' "$url/" | grep -i '^content-encoding' | tr -d '\r')
          echo "::notice title=Canlı adres::$url · giriş sayfası: $login ($title) · API korumalı: $api · $enc"
